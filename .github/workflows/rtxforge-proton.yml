name: RTXForge Proton runtime
on:
  workflow_dispatch:
  push:
    branches: [rtxforge-proton]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: microsoft/setup-msbuild@v2
      - name: Build PE runtime for Proton
        run: msbuild OptiScaler.sln /m:1 /p:Configuration=Release /p:Platform=x64 /p:MultiProcessorCompilation=false /verbosity:minimal
      - name: Record pinned identity
        shell: pwsh
        run: |
          $dll = 'x64/Release/a/OptiScaler.dll'
          $hash = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLower()
          @{ schema=1; policy='RTXForge.NrPanel.v1'; capabilities=@('RTXForge.NativeMfgMenu.v3c'); upstream_commit='7b7220bbb4994a9c8ae60cfc75a44cb67995efb8'; fork_commit='${{ github.sha }}'; sha256=$hash } | ConvertTo-Json | Set-Content x64/Release/a/rtxforge-loader.json
      - uses: actions/upload-artifact@v4
        with:
          name: rtxforge-proton-loader
          path: |
            x64/Release/a/OptiScaler.dll
            x64/Release/a/rtxforge-loader.json
